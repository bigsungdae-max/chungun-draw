    toFire: 0, shotIndex: 0, cool: 0, charging: 0, chargeDur: 0, glow: 0,
    recoil: 0, shake: 0, flashT: 0, iflash: 0, busy: false, loop: false,
    w: 0, h: 0, dpr: 1, wide: true, V: { x: 0, y: 0, w: 1, h: 1 }, last: 0, t: 0,
  };
  const stars = Array.from({ length: 90 }, (_, i) => ({ fx: ((i * 397) % 1000) / 1000, fy: ((i * 151) % 1000) / 1000, r: (i % 3) * 0.5 + 0.7, p: i * 0.7 }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function cValid() {
    return cs.mode === 'names' ? cs.total > 0 : Number.isInteger(cs.max) && cs.max >= 3 && cs.max <= 10000;
  }
  function cBuildPool() {
    cs.pool = [];
    if (cs.mode === 'number') {
      if (cValid()) for (let i = 1; i <= cs.max; i++) cs.pool.push({ label: String(i), color: `hsl(${hueFor(i)} 80% 62%)` });
    } else {
      parseNames(namesEl.value).forEach((e, i) => {
        for (let k = 0; k < e.count; k++) cs.pool.push({ label: e.name, color: `hsl(${hueFor(i)} 80% 62%)` });
      });
    }
    cs.total = cs.pool.length;
    cs.drawn = []; cs.balls = []; cs.hits = []; cs.shells = []; cs.toFire = 0; cs.charging = 0; cs.glow = 0;
    chist.innerHTML = '<li class="empty">아직 나온 공이 없어요</li>';
    cRender();
  }
  function cPick() {
    if (cs.repeat) return cs.pool[Math.floor(Math.random() * cs.pool.length)];
    return cs.pool.splice(Math.floor(Math.random() * cs.pool.length), 1)[0];
  }
  function cRender() {
    const ok = cValid();
    $('#cerr').hidden = cs.mode !== 'number' || ok;
    const left = cs.repeat ? cs.total : cs.pool.length;
    cleftEl.textContent = cs.total ? (cs.repeat ? `공 ${cs.total}개` : `남은 공 ${left}/${cs.total}`) : '';
    cfireBtn.disabled = cs.busy || !ok || left === 0;
    cresetBtn.disabled = cs.busy;
    ccontrols.disabled = cs.busy;
    cstatusEl.dataset.state = cs.busy ? 'running' : left === 0 && cs.total ? 'done' : 'idle';
    let msg;
    if (!ok) msg = cs.mode === 'names' ? '참가자 명단을 입력해 주세요' : '번호 범위를 확인해 주세요';
    else if (cs.busy) msg = cs.charging > 0 ? '두구두구… 장전 중' : cs.balls.length ? '날아와요!' : '발사!';
    else if (left === 0) msg = '공을 모두 뽑았어요 · 처음부터를 눌러 다시 시작해요';
    else msg = `발사 대기 · ${cs.mode === 'number' ? `1~${cs.max}번` : `참가자 공 ${cs.total}개`}${cs.repeat ? ' · 중복 허용' : ''}`;
    cstatusText.textContent = msg;
  }
  function cAddHistory(item, n) {
    const empty = chist.querySelector('.empty');
    if (empty) empty.remove();
    const li = document.createElement('li');
    li.innerHTML = '<span class="rk"></span><i></i><span class="nm"></span>';
    li.querySelector('.rk').textContent = n;
    li.querySelector('i').style.setProperty('--c', item.color);
    li.querySelector('.nm').textContent = item.label;
    chist.prepend(li);
    if (cs.wide) chist.scrollTop = 0; else chist.scrollLeft = 0;
  }

  // where each shot of a burst hits the glass, as fractions of the view
  const SLOTS = {
    1: [[0.5, 0.5]],
    3: [[0.22, 0.5], [0.5, 0.46], [0.78, 0.5]],
    5: [[0.2, 0.36], [0.5, 0.32], [0.8, 0.36], [0.34, 0.72], [0.66, 0.72]],
  };
  function cFire() {
    if (cs.busy || !cValid()) return;
    const left = cs.repeat ? Infinity : cs.pool.length;
    if (!left) return;
    Sfx.init();
    cs.busy = true;
    cs.toFire = Math.min(cs.burst, left);
    cs.shotIndex = 0; cs.cool = 0; cs.charging = 0;
    cs.balls = []; cs.hits = []; cs.shells = [];
    const base = SLOTS[cs.toFire] || SLOTS[cs.toFire >= 3 ? 3 : 1];
    cs.slots = shuffle(base.map(([fx, fy]) => [fx + rnd(-0.04, 0.04), fy + rnd(-0.05, 0.05)]));
    if (cs.toFire === 1) cs.slots = [[rnd(0.36, 0.64), rnd(0.42, 0.6)]];
    if (cs.toFire === 2) cs.slots = [[0.32, 0.5], [0.68, 0.5]];
    if (cs.toFire === 4) cs.slots = shuffle([[0.3, 0.36], [0.7, 0.36], [0.3, 0.72], [0.7, 0.72]]);
    cRender();
  }

  function geo() {
    const V = cs.V;
    return {
      V,
      hy: V.y + V.h * 0.4,                     // horizon
      eye: V.h * 0.6,                          // how far the ground sits below eye level at the glass
      vx: V.x + V.w / 2,                       // vanishing point
      unit: Math.min(V.h, V.w * 0.9) / 560,    // size of one world unit at k = 1
    };
  }
  // flight speed: steady, then the last 30% slows right down so the ball looms
  const warp = (p) => { const x = clamp01((p - 0.7) / 0.3); return 1 - 0.74 * x * x * (3 - 2 * x); };
  const FLIGHT_T = 1.15;
  function flightSeconds() {
    let p = 0, t = 0;
    while (p < 1 && t < 10) { p += (1 / 120) / FLIGHT_T * warp(p); t += 1 / 120; }
    return t;
  }
  function cannonPose(g) {
    const k = (ZF / Z_FAR) * (1 - 0.07 * cs.recoil);
    const shakeX = cs.charging > 0 && !reduceMotion ? Math.sin(cs.t * 70) * 2.5 * cs.glow : 0;
    const bx = g.vx + shakeX, by = g.hy + g.eye * k, u = g.unit * k;
    return { k, bx, by, u, mx: bx, my: by - 230 * u };
  }
  function ballScreen(b, g) {
    const z = Z_FAR + (ZF - Z_FAR) * b.p, k = ZF / z;
    const x = b.x0 + (b.xi - b.x0) * b.p;
    const y = b.y0 + (b.yi - b.y0) * b.p - b.arc * 4 * b.p * (1 - b.p);
    return { x: g.vx + x * k, y: g.hy + y * k, r: b.R * k, k };
  }
  function makeCrack(R) {
    const rays = [], n = 12 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-0.2, 0.2), len = R * rnd(1.7, 3.6);
      const pts = [[0, 0]];
      for (let sgi = 1; sgi <= 5; sgi++) {
        const rr = (len * sgi) / 5, aa = a + rnd(-0.16, 0.16);
        pts.push([Math.cos(aa) * rr, Math.sin(aa) * rr]);
      }
      rays.push(pts);
    }
    const rings = [];
    for (const j of [1, 2, 3]) for (let i = 0; i < n; i++) if (Math.random() < 0.7) rings.push([i, (i + 1) % n, j]);
    return { rays, rings };
  }

  function fireShot() {
    const g = geo(), pose = cannonPose(g);
    const [fx, fy] = cs.slots[cs.shotIndex] || [0.5, 0.5];
    const sx = g.V.x + fx * g.V.w, sy = g.V.y + fy * g.V.h;
    const multi = cs.burst > 1;
    const R = Math.min(g.V.h * (multi ? 0.105 : 0.15), g.V.w * (multi ? 0.1 : 0.16));
    cs.balls.push({
      item: cPick(), p: 0, R, rot: 0, spin: rnd(-7, 7), trail: [],
      x0: 0, y0: g.eye - 230 * g.unit, xi: sx - g.vx, yi: sy - g.hy, arc: g.V.h * rnd(0.28, 0.42),
      order: cs.shotIndex,
    });
    cs.recoil = 1; cs.flashT = 1; cs.glow = 0; cs.shake = Math.max(cs.shake, 0.35);
    for (let i = 0; i < 14; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(20, 90) * g.unit;
      cs.smoke.push({ x: pose.mx, y: pose.my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20 * g.unit, r: rnd(6, 14) * g.unit, grow: 40 * g.unit, life: 1.4, max: 1.4 });
    }
    Sfx.boom(); Sfx.whoosh(flightSeconds());
    cs.toFire--; cs.shotIndex++; cs.charging = 0; cs.cool = 0.8;
    cRender();
  }

  function impact(b, g) {
    const sp = ballScreen(b, g);
    const n = cs.drawn.length + 1;
    cs.drawn.push(b.item);
    cs.hits.push({ x: sp.x, y: sp.y, R: b.R, item: b.item, n, t: 0, crack: makeCrack(b.R) });
    cAddHistory(b.item, n);
    for (const side of [-1, 1]) {
      cs.shells.push({ x: sp.x, y: sp.y, R: b.R, side, vx: side * rnd(380, 560) * g.unit, vy: rnd(-420, -260) * g.unit, rot: 0, vr: side * rnd(4, 8), life: 1.6, g: 1500 * g.unit });
    }
    for (let i = 0; i < 46; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(200, 700) * g.unit;
      cs.sparks.push({ x: sp.x, y: sp.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * g.unit, life: rnd(0.6, 1.2), max: 1.2, color: i % 3 ? b.item.color : C.brass, g: 900 * g.unit, size: rnd(3, 7) * g.unit });
    }
    cs.shake = 1; cs.iflash = 1;
    Sfx.crack(); Sfx.reveal();
  }

  function cUpdate(dt) {
    cs.t += dt;
    const g = geo();
    // load, drumroll, fire
    if (cs.toFire > 0) {
      if (cs.cool > 0) cs.cool -= dt;
      else if (cs.charging === 0) {
        cs.charging = 1e-6;
        cs.chargeDur = cs.shotIndex === 0 ? 1.1 : 0.5;
        if (cs.shotIndex === 0) Sfx.drumroll(1.05); else Sfx.fuse();
        cRender();
      } else {
        cs.charging += dt;
        cs.glow = clamp01(cs.charging / cs.chargeDur);
        if (cs.charging >= cs.chargeDur) fireShot();
      }
    }
    cs.recoil = Math.max(0, cs.recoil - dt * 2.5);
    cs.shake = Math.max(0, cs.shake - dt * 2.8);
    cs.flashT = Math.max(0, cs.flashT - dt * 5);
    cs.iflash = Math.max(0, cs.iflash - dt * 4);

    for (const b of cs.balls) {
      b.p = Math.min(1, b.p + (dt / FLIGHT_T) * warp(b.p));
      b.rot += b.spin * dt;
      const sp = ballScreen(b, g);

      if (b.trail.length > 7) b.trail.shift();
      if (b.p >= 1) { b.done = true; impact(b, g); }
    }
    if (cs.balls.some((b) => b.done)) { cs.balls = cs.balls.filter((b) => !b.done); cRender(); }
    for (const h of cs.hits) h.t += dt;

    if (cs.busy && cs.toFire === 0 && cs.charging === 0 && !cs.balls.length && cs.hits.every((h) => h.t > 0.5)) {
      cs.busy = false; cRender();
    }

    for (let i = cs.smoke.length - 1; i >= 0; i--) {
      const p = cs.smoke[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt; p.r += p.grow * dt;
      if (p.life <= 0) cs.smoke.splice(i, 1);
    }
    for (let i = cs.sparks.length - 1; i >= 0; i--) {
      const p = cs.sparks[i];
      p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) cs.sparks.splice(i, 1);
    }
    for (let i = cs.shells.length - 1; i >= 0; i--) {
      const p = cs.shells[i];
      p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.life <= 0) cs.shells.splice(i, 1);
    }
  }

  function cResize() {
    const r = cstageEl.getBoundingClientRect();
    if (!r.width) return;
    cs.w = r.width; cs.h = r.height;
    cs.dpr = Math.min(window.devicePixelRatio || 1, 2);
    ccv.width = Math.round(cs.w * cs.dpr); ccv.height = Math.round(cs.h * cs.dpr);
    cs.wide = cs.w >= 720;
    cstageEl.classList.toggle('wide', cs.wide);
    cstageEl.classList.toggle('narrow', !cs.wide);
    cs.V = cs.wide ? { x: 0, y: 0, w: cs.w - 212, h: cs.h } : { x: 0, y: 0, w: cs.w, h: cs.h - 64 };
  }
  new ResizeObserver(cResize).observe(cstageEl);

  function cDraw() {
    const c = c2, d = cs.dpr, g = geo(), { V, hy, eye, vx, unit } = g;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.fillStyle = C.bg; c.fillRect(0, 0, cs.w, cs.h);
    const jx = reduceMotion ? 0 : (Math.random() - 0.5) * 22 * cs.shake * unit;
    const jy = reduceMotion ? 0 : (Math.random() - 0.5) * 18 * cs.shake * unit;
    c.save(); c.translate(jx, jy);

    // sky and stars
    const sky = c.createLinearGradient(0, 0, 0, hy);
    sky.addColorStop(0, C.bg); sky.addColorStop(1, C.cabinet);
    c.fillStyle = sky; c.fillRect(-40, -40, cs.w + 80, hy + 40);
    for (const st of stars) {
      const sy = V.y + st.fy * (hy - V.y) * 0.95;
      c.globalAlpha = 0.4 + 0.4 * Math.sin(cs.t * 1.3 + st.p);
      c.fillStyle = C.muted; c.beginPath(); c.arc(V.x + st.fx * V.w, sy, st.r, 0, 6.2832); c.fill();
    }
    c.globalAlpha = 1;
    // far ridge
    c.fillStyle = C.felt;
    c.beginPath(); c.moveTo(-40, hy + 1);
    for (let x = -40; x <= cs.w + 40; x += 24) c.lineTo(x, hy - (10 + Math.sin(x * 0.013) * 8 + Math.sin(x * 0.031) * 5) * unit);
    c.lineTo(cs.w + 40, hy + 1); c.closePath(); c.fill();
    // ground with a perspective grid running away from you
    c.fillStyle = C.felt; c.fillRect(-40, hy, cs.w + 80, cs.h - hy + 40);
    c.save();
    c.beginPath(); c.rect(-40, hy, cs.w + 80, cs.h); c.clip();
    c.strokeStyle = C.line; c.lineWidth = 1.2;
    for (let j = 0; j < 14; j++) {
      const z = ZF * Math.pow(1.32, j), y = hy + eye * (ZF / z);
      c.globalAlpha = Math.max(0.15, 1 - j / 14);
      c.beginPath(); c.moveTo(-40, y); c.lineTo(cs.w + 40, y); c.stroke();
    }
    c.globalAlpha = 0.6;
    for (let i = -8; i <= 8; i++) {
      const xw = i * V.w * 0.16;
      c.beginPath(); c.moveTo(vx + xw * 1.6, hy + eye * 1.6); c.lineTo(vx, hy); c.stroke();
    }
    c.globalAlpha = 1;
    // brass rails leading to the cannon
    const pose = cannonPose(g);
    c.strokeStyle = C.brassDeep; c.lineWidth = 3;
    for (const sgn of [-1, 1]) {
      c.beginPath(); c.moveTo(vx + sgn * V.w * 0.2 * 1.6, hy + eye * 1.6); c.lineTo(vx + sgn * 150 * pose.u, pose.by); c.stroke();
    }
    c.restore();

    drawCannon(c, g, pose);

    // smoke over the cannon
    for (const p of cs.smoke) {
      c.globalAlpha = Math.max(0, p.life / p.max) * 0.5;
      c.fillStyle = C.muted; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.2832); c.fill();
    }
    c.globalAlpha = 1;
    // muzzle flash, aimed at you
    if (cs.flashT > 0) {
      const rf = (60 + 220 * cs.flashT) * pose.u * 3;
      const gr = c.createRadialGradient(pose.mx, pose.my, 0, pose.mx, pose.my, rf);
      gr.addColorStop(0, C.fg); gr.addColorStop(0.35, C.brass); gr.addColorStop(1, 'rgba(240,189,79,0)');
      c.globalAlpha = cs.flashT; c.fillStyle = gr;
      c.beginPath(); c.arc(pose.mx, pose.my, rf, 0, 6.2832); c.fill();
      c.globalAlpha = 1;
    }

    // balls in flight, far ones first
    const flying = cs.balls.slice().sort((a, b) => a.p - b.p);
    for (const b of flying) {
      const sp = ballScreen(b, g);
      // shadow on the ground beneath it
      const gy = hy + eye * sp.k;
      c.globalAlpha = 0.35; c.fillStyle = C.bg;
      c.beginPath(); c.ellipse(sp.x, Math.min(cs.h + 20, gy), sp.r, sp.r * 0.22, 0, 0, 6.2832); c.fill();
      // motion trail
      b.trail.forEach((tp, i) => {
        c.globalAlpha = (i / b.trail.length) * 0.18;
        c.fillStyle = C.fg; c.beginPath(); c.arc(tp.x, tp.y, tp.r, 0, 6.2832); c.fill();
      });
      c.globalAlpha = 1;
      drawSealedBall(c, sp.x, sp.y, sp.r, b.rot, 1, 1);
    }

    // the glass: cracks and the revealed picks
    for (const h of cs.hits) drawHit(c, h);
    for (const p of cs.shells) drawShell(c, p);
    for (const p of cs.sparks) {
      c.globalAlpha = Math.max(0, p.life / p.max);
      c.fillStyle = p.color; c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    c.globalAlpha = 1;
    c.restore();

    // impact flash
    if (cs.iflash > 0) {
      c.globalAlpha = cs.iflash * 0.45; c.fillStyle = C.fg; c.fillRect(0, 0, cs.w, cs.h); c.globalAlpha = 1;
    }
    // first-visit hint
    if (!cs.busy && !cs.hits.length) {
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = `500 ${Math.round(Math.max(13, 15 * Math.min(1.2, unit)))}px ` + T('--font-body');
      c.fillStyle = C.fg;
      c.fillText(cValid() ? '발사! 버튼이나 스페이스바를 누르면 대포가 화면을 향해 쏴요' : '왼쪽에서 뽑을 대상을 정해 주세요', vx, V.y + V.h * 0.78);
    }
  }

  function drawCannon(c, g, pose) {
    const { bx, by, u } = pose;
    // mound
    c.fillStyle = C.cabinet;
    c.beginPath(); c.ellipse(bx, by, 330 * u, 46 * u, 0, 0, 6.2832); c.fill();
    // carriage
    c.fillStyle = C.brassDeep;
    c.beginPath();
    c.moveTo(bx - 160 * u, by - 20 * u); c.lineTo(bx + 160 * u, by - 20 * u);
    c.lineTo(bx + 110 * u, by - 210 * u); c.lineTo(bx - 110 * u, by - 210 * u); c.closePath(); c.fill();
    // wheels, seen edge-on from the front
    for (const sgn of [-1, 1]) {
      const wx = bx + sgn * 190 * u, wy = by - 125 * u;
      c.fillStyle = C.bg; c.beginPath(); c.ellipse(wx, wy, 34 * u, 125 * u, 0, 0, 6.2832); c.fill();
      c.strokeStyle = C.brass; c.lineWidth = Math.max(1.5, 12 * u);
      c.beginPath(); c.ellipse(wx, wy, 34 * u, 125 * u, 0, 0, 6.2832); c.stroke();
      c.fillStyle = C.brass; c.beginPath(); c.ellipse(wx, wy, 14 * u, 22 * u, 0, 0, 6.2832); c.fill();
    }
    // barrel body, tipped up toward you
    const mx = pose.mx, my = pose.my;
    c.fillStyle = C.line;
    c.beginPath(); c.arc(mx, my - 70 * u, 82 * u, 0, 6.2832); c.fill();
    c.fillRect(mx - 90 * u, my - 70 * u, 180 * u, 70 * u);
    c.fillStyle = C.brass;
    c.fillRect(mx - 88 * u, my - 52 * u, 176 * u, 12 * u);
    // muzzle rings and bore
    c.beginPath(); c.arc(mx, my, 100 * u, 0, 6.2832); c.fill();
    c.fillStyle = C.line; c.beginPath(); c.arc(mx, my, 84 * u, 0, 6.2832); c.fill();
    c.fillStyle = C.bg; c.beginPath(); c.arc(mx, my, 66 * u, 0, 6.2832); c.fill();
    if (cs.glow > 0) {
      const gr = c.createRadialGradient(mx, my, 0, mx, my, 66 * u);
      gr.addColorStop(0, C.brass); gr.addColorStop(1, 'rgba(255,92,122,0)');
      c.globalAlpha = cs.glow * (0.6 + 0.4 * Math.sin(cs.t * 30));
      c.fillStyle = gr; c.beginPath(); c.arc(mx, my, 66 * u, 0, 6.2832); c.fill();
      c.globalAlpha = 1;
    }
  }

  // the shot: a steel shell with a riveted brass band and a brass question mark
  function drawSealedBall(c, x, y, r, rot, sx, sy) {
    c.save(); c.translate(x, y); c.scale(sx, sy);
    const gr = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.08, 0, 0, r);
    gr.addColorStop(0, C.muted); gr.addColorStop(0.55, C.line); gr.addColorStop(1, C.bg);
    c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r, 0, 6.2832); c.fill();
    c.rotate(Math.sin(rot) * 0.5);
    c.strokeStyle = C.brass; c.lineWidth = Math.max(1, r * 0.15);
    c.beginPath(); c.ellipse(0, r * 0.18, r * 0.97, r * 0.3, 0, 0, Math.PI); c.stroke();
    if (r > 8) {
      c.fillStyle = C.brassDeep;
      for (let i = 1; i < 7; i++) {
        const th = (i / 7) * Math.PI;
        c.beginPath(); c.arc(Math.cos(th) * r * 0.97, r * 0.18 + Math.sin(th) * r * 0.3, r * 0.045, 0, 6.2832); c.fill();
      }
      c.font = `400 ${Math.round(r * 0.78)}px ` + T('--font-display');
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = Math.max(1, r * 0.08); c.strokeStyle = C.bg; c.strokeText('?', 0, -r * 0.22);
      c.fillStyle = C.brass; c.fillText('?', 0, -r * 0.22);
    }
    c.restore();
  }

  function drawShell(c, p) {
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
    c.globalAlpha = Math.min(1, p.life);
    const a0 = p.side < 0 ? Math.PI / 2 : -Math.PI / 2, a1 = a0 + Math.PI;
    const gr = c.createRadialGradient(-p.R * 0.3, -p.R * 0.3, p.R * 0.08, 0, 0, p.R);
    gr.addColorStop(0, C.muted); gr.addColorStop(0.55, C.line); gr.addColorStop(1, C.bg);
    c.fillStyle = gr; c.beginPath(); c.arc(0, 0, p.R, a0, a1); c.closePath(); c.fill();
    c.strokeStyle = C.brass; c.lineWidth = Math.max(2, p.R * 0.08);
    c.beginPath(); c.moveTo(0, -p.R); c.lineTo(0, p.R); c.stroke();
    c.restore();
    c.globalAlpha = 1;
  }

  function drawHit(c, h) {
    const grow = clamp01(h.t / 0.14);
    const { rays, rings } = h.crack;
    c.save(); c.translate(h.x, h.y);
    // frosted spot where it struck
    const fr = c.createRadialGradient(0, 0, 0, 0, 0, h.R * 1.6);
    fr.addColorStop(0, 'rgba(239,234,255,0.22)'); fr.addColorStop(1, 'rgba(239,234,255,0)');
    c.fillStyle = fr; c.beginPath(); c.arc(0, 0, h.R * 1.6, 0, 6.2832); c.fill();
    // cracks: a dark shadow line, then a bright edge
    c.lineCap = 'round'; c.lineJoin = 'round';
    for (const pass of [0, 1]) {
      c.strokeStyle = pass ? 'rgba(239,234,255,0.85)' : 'rgba(18,17,42,0.55)';
      c.lineWidth = pass ? 1.4 : 3;
      const off = pass ? 0 : 1;
      for (const pts of rays) {
        const nSeg = (pts.length - 1) * grow;
        c.beginPath(); c.moveTo(pts[0][0] + off, pts[0][1] + off);
        for (let i = 1; i < pts.length; i++) {
          if (i - 1 >= nSeg) break;
          const f = Math.min(1, nSeg - (i - 1));
          const x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f;
          c.lineTo(x + off, y + off);
        }
        c.stroke();
      }
      if (grow >= 1) {
        for (const [a, b, j] of rings) {
          c.beginPath(); c.moveTo(rays[a][j][0] + off, rays[a][j][1] + off); c.lineTo(rays[b][j][0] + off, rays[b][j][1] + off); c.stroke();
        }
      }
    }
    // the ball squashes on the glass for a moment, then the pick pops out
    if (h.t < 0.09) {
      drawSealedBall(c, 0, 0, h.R, 0, 1.25, 0.78);
    } else {
      const k = clamp01((h.t - 0.09) / 0.32);
      const pop = reduceMotion ? 1 : 1 + 1.7 * Math.pow(k - 1, 3) + 0.7 * Math.pow(k - 1, 2);
      const r = h.R * 0.98 * pop;
      c.fillStyle = C.cabinet; c.beginPath(); c.arc(0, 0, r, 0, 6.2832); c.fill();
      c.strokeStyle = h.item.color; c.lineWidth = Math.max(3, h.R * 0.11); c.stroke();
      c.strokeStyle = C.brass; c.lineWidth = Math.max(1, h.R * 0.03);
      c.beginPath(); c.arc(0, 0, r * 0.84, 0, 6.2832); c.stroke();
      const label = h.item.label.length > 10 ? h.item.label.slice(0, 10) + '…' : h.item.label;
      let size = h.R * 0.9 * pop;
      c.font = `400 ${Math.round(size)}px ` + T('--font-display');
      const w = c.measureText(label).width;
      if (w > r * 1.55) { size *= (r * 1.55) / w; c.font = `400 ${Math.round(size)}px ` + T('--font-display'); }
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = C.fg; c.fillText(label, 0, size * 0.05);
      // order tag under the badge
      c.font = `700 ${Math.round(Math.max(11, h.R * 0.2))}px ` + T('--font-body');
      c.fillStyle = C.brass;
      c.fillText(`${h.n}번째`, 0, r + Math.max(12, h.R * 0.26));
    }
    c.restore();
  }

  function cFrame(now) {
    if (game !== 'cannon') { cs.loop = false; return; }
    const dt = Math.max(0, Math.min(0.05, (now - cs.last) / 1000));
    cs.last = now;
    cUpdate(dt);
    cDraw();
    requestAnimationFrame(cFrame);
  }
  function cStartLoop() {
    if (cs.loop) return;
    cs.loop = true; cs.last = performance.now();
    requestAnimationFrame(cFrame);
  }

  // ---------- game switching ----------
  const GAMES = {
    pinball: { title: '핀볼 추첨기', sub: '구슬을 한꺼번에 떨어뜨려 도착 순서로 당첨자를 뽑아요.' },
    cannon: { title: '대포뽑기', sub: '대포가 화면을 향해 공을 쏴요. 공이 유리를 깨고 열리면 번호나 이름이 나와요.' },
  };
  function updateNamesField() {
    $('#namesField').hidden = game === 'cannon' && cs.mode === 'number';
  }
  function setGame(g) {
    game = g === 'cannon' ? 'cannon' : 'pinball';
    document.querySelectorAll('#gameSeg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.game === game)));
    const pin = game === 'pinball';
    stageEl.hidden = !pin; cstageEl.hidden = pin;
    controls.hidden = !pin; $('#pactions').hidden = !pin;
    ccontrols.hidden = pin; $('#cactions').hidden = pin;
    $('#brandTitle').textContent = GAMES[game].title;
    $('#brandSub').textContent = GAMES[game].sub;
    updateNamesField();
    Sfx.drone(0);
    if (pin) resize();
    else { cResize(); if (!cs.total || (cs.mode === 'names' && !cs.drawn.length && !cs.busy)) cBuildPool(); cStartLoop(); }
    save();
  }
  $('#gameSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (b) setGame(b.dataset.game);
  });
  $('#cmodeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || cs.busy) return;
    cs.mode = b.dataset.cmode; setPressed('#cmodeSeg', 'cmode', cs.mode);
    $('#crangeWrap').hidden = cs.mode !== 'number';
    updateNamesField(); cBuildPool(); save();
  });
  $('#cmax').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    cs.max = Number.isInteger(v) ? v : NaN;
    cBuildPool(); save();
  });
  $('#cburstSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || cs.busy) return;
    cs.burst = Number(b.dataset.burst); setPressed('#cburstSeg', 'burst', cs.burst); save();
  });
  $('#crepeat').addEventListener('change', (e) => { cs.repeat = e.target.checked; cBuildPool(); save(); });
  cfireBtn.addEventListener('click', cFire);
  cresetBtn.addEventListener('click', () => { if (!cs.busy) cBuildPool(); });
  document.addEventListener('keydown', (e) => {
    if (game !== 'cannon' || (e.key !== ' ' && e.key !== 'Enter')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
    e.preventDefault();
    cFire();
  });

  // ---------- boot ----------
  const SAMPLE = '민준, 서연, 도윤, 하은, 지호, 수아, 예준, 지우, 시우, 하린, 은우, 채원*2';
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('pinball-lottery') || 'null'); } catch (e) { saved = null; }
  namesEl.value = saved && typeof saved.names === 'string' ? saved.names : SAMPLE;
  if (saved) {
    if (['first', 'last', 'custom'].includes(saved.rule)) rule = saved.rule;
    if (saved.customRank) customRank = saved.customRank | 0 || 3;
    if ([1, 2, 3].includes(saved.speed)) speed = saved.speed;
    if (typeof saved.slowmoOn === 'boolean') slowmoOn = saved.slowmoOn;
    if (typeof saved.gateOn === 'boolean') gateOn = saved.gateOn;
    if (typeof saved.soundOn === 'boolean') soundOn = saved.soundOn;
    if (['valley', 'starlight', 'pinwheel', 'bubble', 'well', 'galaxy'].includes(saved.map)) map = makeMap(saved.map);
  }
  setPressed('#ruleSeg', 'rule', rule);
  setPressed('#speedSeg', 'speed', speed);
  $('#customWrap').hidden = rule !== 'custom';
  $('#rank').value = customRank;
  $('#map').value = map.id;
  $('#slowmo').checked = slowmoOn;
  $('#gateOn').checked = gateOn;
  if (saved) {
    if (saved.cmode === 'names' || saved.cmode === 'number') cs.mode = saved.cmode;
    if (Number.isInteger(saved.cmax)) cs.max = saved.cmax;
    if ([1, 3, 5].includes(saved.cburst)) cs.burst = saved.cburst;
    if (typeof saved.crepeat === 'boolean') cs.repeat = saved.crepeat;
  }
  setPressed('#cmodeSeg', 'cmode', cs.mode);
  setPressed('#cburstSeg', 'burst', cs.burst);
  $('#cmax').value = Number.isInteger(cs.max) ? cs.max : 30;
  if (!Number.isInteger(cs.max)) cs.max = 30;
  $('#crepeat').checked = cs.repeat;
  $('#crangeWrap').hidden = cs.mode !== 'number';
  renderSound();
  resize();
  setup();
  setGame(saved && saved.game === 'cannon' ? 'cannon' : 'pinball');
  requestAnimationFrame(frame);
})();
</script>

<style>
.install-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.install-row .chip { background: var(--bg); }
.install-row .ios-hint { color: var(--muted); font-size: 12.5px; }
</style>
<script>
(() => {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  const brand = document.querySelector('.brand');
  const row = document.createElement('div');
  row.className = 'install-row';
  row.hidden = true;
  brand.appendChild(row);
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    row.innerHTML = '<button type="button" class="chip" id="installApp">앱으로 설치</button>';
    row.hidden = false;
    row.querySelector('button').addEventListener('click', async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null; row.hidden = true;
    });
  });
  window.addEventListener('appinstalled', () => { row.hidden = true; });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    row.innerHTML = '<span class="ios-hint">홈 화면에 두려면 공유 버튼 → <b>홈 화면에 추가</b></span>';
    row.hidden = false;
  }
})();
</script>
</body>
